name: Compile and Build Site

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
      - template
  schedule:
    - cron: '{ github.workflows.build.schedule }' # auto-build schedule (configurable in ultimate-jekyll-manager.json)

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

# permissions:
#   contents: write

env:
  { githubSecrets }
  RUBY_VERSION: '{ versions.ruby }'
  BUNDLER_VERSION: '{ versions.bundler }'
  NODE_VERSION: '{ versions.node }'
  UJ_BUILD_MODE: 'true'
  UJ_IS_SERVER: 'true'

jobs:
  build:
    # needs: nothing
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - name: Setup git config
        run: |
          git config --global user.email "$GITHUB_ACTOR@users.noreply.github.com"
          git config --global user.name "$GITHUB_ACTOR"
      - name: Checkout main branch
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0
      - name: Setup ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: false
      - name: Install specific bundler version
        run: gem install bundler -v ${{ env.BUNDLER_VERSION }}
      # - name: Run bundle install # TODO: [DEPRECATED] MIGRATE TO: bundle config set --local path 'vendor/bundle'
      #   run: |
      #     bundle install --path vendor/bundle
      - name: Ensure Gemfile uses published gem (not local path)
        run: |
          sed -i 's|gem "jekyll-uj-powertools", path:.*|gem "jekyll-uj-powertools", "~> 1.0"|g' Gemfile
      - name: Run bundle install
        run: |
          bundle install
      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Socket Firewall
        run: npm install -g sfw
      # Retry up to 3 times — transient ECONNRESET / socket hang-ups on GH Actions
      # runners are common, and sfw crashes (instead of gracefully degrading) when
      # a fetch fails mid-flight, killing the whole job.
      - name: Run node install (with retry)
        run: |
          for attempt in 1 2 3; do
            echo "Install attempt $attempt of 3..."
            sfw npm install && break
            echo "Attempt $attempt failed"
            if [ "$attempt" -eq 3 ]; then
              echo "All 3 install attempts failed"
              exit 1
            fi
            sleep 15
          done
      - name: Log dependency versions
        run: |
          echo "🖥️ Unix Versions: "
          uname -a
          echo -e "\n"

          echo "🐧 Ubuntu Versions: "
          lsb_release -a
          echo -e "\n"

          echo "🔧 Framework Versions: "
          echo "Ruby: $(ruby -v)"
          echo "Bundler: $(bundle -v)"
          echo "Gem: $(gem -v)"
          echo "Jekyll: $(jekyll -v)"
          echo "Node: $(node -v)"
          echo "NPM: $(npm -v)"
          echo "Ultimate Jekyll: $(npx uj version)"
          echo -e "\n"

          echo "💎 Gem Versions: "
          gem list
          echo -e "\n"

          echo "📦 NPM Dependency Versions: "
          npm list --depth=0 || echo ""
          echo -e "\n"
      - name: Log all files in repo
        run: |
          echo "All files in the repo: "
          ls -R *
      - name: Run node build
        run: |
          UJ_BUILD_MODE=true UJ_IS_SERVER=true npx uj setup && npm run build
      # - name: Delete gh-pages branch
      #   continue-on-error: true
      #   run: |
      #     curl -L \
      #       -X DELETE \
      #       -H "Authorization: token ${{ secrets.GH_TOKEN }}" \
      #       https://api.github.com/repos/$GITHUB_REPOSITORY/git/refs/heads/gh-pages
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GH_TOKEN }}
          publish_dir: ./_site
          # enable_jekyll: true
      - name: Purge CloudFlare cache
        run: npx uj cloudflare-purge
      - name: Purge artifacts
        uses: kolpav/purge-artifacts-action@v1
        with:
          token: ${{ secrets.GH_TOKEN }}
          expire-in: 30 minutes # Set this to 0 to delete instantly
